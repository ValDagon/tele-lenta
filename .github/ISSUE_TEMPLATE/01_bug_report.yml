name: "Bug report"
description: "Something is broken: a test fails, a screen misbehaves, the collector stops."
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. The more exact the reproduction, the faster it gets fixed."

  - type: dropdown
    id: surface
    attributes:
      label: "Where does it happen?"
      options:
        - "Mini App (the Telegram screen)"
        - "Collector (vps/: API, tick, backfill, store)"
        - "Serverless BFF (tgcloud/: endpoints, bot handler)"
        - "Repository itself (build, tests, CI, docs)"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "OS, Node version, and the commit you ran"
      placeholder: "macOS 15.3, Node 22.18.0, commit a1b2c3d"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce"
      description: "The exact commands or taps. A failing test name is a perfect reproduction."
      placeholder: "1. npm -w vps run tick\n2. The cursor does not advance past id 42\n3. ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behaviour"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs or output"
      description: "Paste the failing assertion or the error. Redact tokens and ids first."
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: "Security check"
      options:
        - label: "I removed bot tokens, shared secrets, initData, phone numbers, and real user ids from this report."
          required: true
